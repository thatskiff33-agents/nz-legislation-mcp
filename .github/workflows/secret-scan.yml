name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull request runs. Other runs (main, schedule) get a group of their own, so
# a newer run on main never drops a pending one.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only token: report findings in the job log, not as PR comments.
          GITLEAKS_ENABLE_COMMENTS: "false"
