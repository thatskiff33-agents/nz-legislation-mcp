name: Container

on:
  pull_request:
    paths:
      [
        "Dockerfile",
        ".dockerignore",
        "src/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig*.json",
        ".github/workflows/container.yml",
      ]
  # Publishing happens only when release.yml calls this workflow (after its gates). There is no
  # tag-push trigger: anyone able to push a tag could otherwise publish a signed image.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Pull requests: build and scan only (nothing is pushed).
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nz-legislation-mcp:scan
      # Install Trivy from its GitHub release, checked against a pinned SHA-256, instead of the
      # action's installer (which downloads from get.trivy.dev and fails when that host is down).
      - name: Install Trivy (pinned, checksum verified)
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan image (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: nz-legislation-mcp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  # Release tags: multi-arch build, push to GHCR, SBOM and provenance, keyless cosign signature.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Publishing waits for an owner's approval on the "release" environment.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          # "latest" is added automatically for non-prerelease versions (flavor latest=auto).
      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nz-legislation-mcp:release-scan
      # Install Trivy from its GitHub release, checked against a pinned SHA-256, instead of the
      # action's installer (which downloads from get.trivy.dev and fails when that host is down).
      - name: Install Trivy (pinned, checksum verified)
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan before publishing (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: nz-legislation-mcp:release-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
