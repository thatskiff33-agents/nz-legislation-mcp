name: Release

# release-please keeps a release pull request open on main (version bump and changelog). Merging
# that pull request creates the tag and a DRAFT GitHub release; it is published only after every
# artefact is out (publish-release). The npm tarball is packed in a job that runs no third-party
# tooling after packing, and its SHA-256 travels to the publishing jobs as a job output, which no
# later job can change. The Claude Desktop bundle is built from that tarball in a separate job, with
# the standard zip command (no third-party tool), so it cannot change what npm publishes. Each publishing job waits for an
# owner's approval on the "release" environment and installs nothing. The container is built from
# the tag source inside BuildKit, which does not expose the job's OIDC token or registry login to
# build steps.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Off until the owner has created the protected "release" environment (PUBLISHING.md) and set
    # the repository variable RELEASE_ENABLED to true. GitHub would otherwise create a missing
    # environment on first use with no protection, and publishing would need no approval.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Updates the version the Claude Code plugin pins (release-please cannot edit part of a string).
  # Runs one dependency-free script; nothing is installed.
  sync-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          persist-credentials: true # needed to push the update to the release branch
      - run: node scripts/sync-release-files.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: pin the Claude Code plugin to the release version"
            git push
          fi

  # Check the release and pack the npm tarball, with no write or publishing permissions. No
  # third-party tooling runs after `pnpm pack`. The tarball's name and SHA-256 are job outputs:
  # later jobs verify against them, so replacing the artifact cannot go unnoticed.
  pack:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/sync-release-files.mjs --check
      - id: pack
        run: |
          mkdir -p npm-tarball
          pnpm pack --pack-destination npm-tarball
          tarball="$(cd npm-tarball && ls -- *.tgz)"
          sha="$(sha256sum -- "npm-tarball/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "npm tarball: $tarball sha256 $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: npm-tarball/
          if-no-files-found: error
          retention-days: 7

  # Build the Claude Desktop bundle from the verified tarball with zip (scripts/build-mcpb.sh). No
  # third-party tool runs here; the mcpb CLI checks the same build in CI only (#37).
  bundle-build:
    needs: [release-please, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm-tarball
      - name: Verify the tarball against the pack job's checksum
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: echo "$SHA256  npm-tarball/$TARBALL" | sha256sum --check --strict
      - id: bundle
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          scripts/build-mcpb.sh "npm-tarball/$TARBALL"
          mkdir -p desktop-bundle
          mv dist/nz-legislation-mcp.mcpb desktop-bundle/
          sha="$(sha256sum -- desktop-bundle/nz-legislation-mcp.mcpb | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Claude Desktop bundle: nz-legislation-mcp.mcpb sha256 $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-bundle
          path: desktop-bundle/
          if-no-files-found: error
          retention-days: 7

  # npm, using trusted publishing (OIDC): no npm token is stored, and provenance is attached.
  # It waits for bundle-build so that a failed bundle stops the release before anything is public.
  npm:
    needs: [release-please, pack, bundle-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm-tarball
      - name: Verify the tarball against the pack job's checksum
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: echo "$SHA256  npm-tarball/$TARBALL" | sha256sum --check --strict
      # Node 24 ships an npm with trusted publishing support. No registry-url: setup-node would
      # write an .npmrc expecting a token, and trusted publishing needs none.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # --ignore-scripts: no lifecycle script runs while this job can mint an OIDC token.
      - env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: npm publish "npm-tarball/$TARBALL" --access public --provenance --ignore-scripts

  # Claude Desktop bundle and checksums, attached to the (still draft) GitHub release.
  bundle:
    needs: [release-please, pack, bundle-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-bundle
          path: assets
      - name: Verify both artefacts and write SHA256SUMS
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          NPM_SHA256: ${{ needs.pack.outputs.sha256 }}
          BUNDLE_SHA256: ${{ needs.bundle-build.outputs.sha256 }}
        run: |
          # Each hash must be exactly one SHA-256, so a job output cannot add lines to SHA256SUMS.
          for sha in "$NPM_SHA256" "$BUNDLE_SHA256"; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Not a SHA-256: $sha" >&2; exit 1; }
          done
          cd assets
          printf '%s  %s\n' "$NPM_SHA256" "$TARBALL" "$BUNDLE_SHA256" "nz-legislation-mcp.mcpb" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      # --clobber: a re-run of this job can replace assets uploaded by an earlier attempt (the
      # release is still a draft, and the files were just verified).
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" assets/nz-legislation-mcp.mcpb assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Container image on GHCR (scanned, signed, with SBOM and provenance). Its publish job carries
  # the same "release" environment gate. Like npm, it waits for bundle-build.
  container:
    needs: [release-please, pack, bundle-build]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  # Publish the draft GitHub release only once npm, the bundle and the container are all out, so
  # a failed or unapproved release never shows up as an empty public release.
  publish-release:
    needs: [release-please, npm, bundle, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
