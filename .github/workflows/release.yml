name: Release

# release-please keeps a release pull request open on main (version bump and changelog). Merging
# that pull request creates the GitHub release and tag. The release is then built and checked in a
# job with no publishing rights, and each publishing job waits for an owner's approval on the
# "release" environment. The npm and bundle jobs install nothing and run no project tooling: they
# only publish the artefacts the build job produced. The container is built from the tag source
# inside BuildKit, which does not expose the job's OIDC token or registry login to build steps.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Off until the owner has created the protected "release" environment (PUBLISHING.md) and set
    # the repository variable RELEASE_ENABLED to true. GitHub would otherwise create a missing
    # environment on first use with no protection, and publishing would need no approval.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Updates the version the Claude Code plugin pins (release-please cannot edit part of a string).
  # Runs one dependency-free script; nothing is installed.
  sync-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          persist-credentials: true # needed to push the update to the release branch
      - run: node scripts/sync-release-files.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: pin the Claude Code plugin to the release version"
            git push
          fi

  # Build and check the release, with no write or publishing permissions.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/sync-release-files.mjs --check
      # The npm tarball, and the Claude Desktop bundle built from exactly that tarball.
      - run: |
          mkdir -p release
          pnpm pack --pack-destination release
          scripts/build-mcpb.sh release/*.tgz
          mv dist/nz-legislation-mcp.mcpb release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # npm, using trusted publishing (OIDC): no npm token is stored, and provenance is attached.
  npm:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      # Node 24 ships an npm with trusted publishing support. No registry-url: setup-node would
      # write an .npmrc expecting a token, and trusted publishing needs none.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # --ignore-scripts: no lifecycle script runs while this job can mint an OIDC token.
      - run: npm publish release/nz-legislation-mcp-*.tgz --access public --provenance --ignore-scripts

  # Claude Desktop bundle and checksums, attached to the GitHub release.
  bundle:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" release/nz-legislation-mcp.mcpb release/SHA256SUMS --repo "$GITHUB_REPOSITORY"

  # Container image on GHCR (scanned, signed, with SBOM and provenance). Its publish job carries
  # the same "release" environment gate.
  container:
    needs: [release-please, build]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
