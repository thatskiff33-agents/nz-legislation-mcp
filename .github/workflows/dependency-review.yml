name: Dependency review

on:
  pull_request:

permissions:
  contents: read

# Cancel superseded pull request runs. Other runs (main, schedule) get a group of their own, so
# a newer run on main never drops a pending one.
concurrency:
  group: dependency-review-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR summary comment on failure
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Time-boxed: dev-only minimatch DoS, see pnpm-workspace.yaml. Tracked in issue #15.
          allow-ghsas: GHSA-g3hv-75wg-m249
          allow-licenses: Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, MPL-2.0
