# Dependabot: weekly grouped updates with a 14-day cooldown (supply-chain hardening).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; move with it deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the oldest supported Node (package.json engines: Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    ignore:
      # Node majors (including odd, non-LTS releases) are moved deliberately with the distroless
      # runtime image; Dependabot keeps patch and minor updates and digests current.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(docker)"
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(docker)"
