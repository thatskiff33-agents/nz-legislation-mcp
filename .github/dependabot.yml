# Dependabot: weekly grouped updates with a 14-day cooldown (supply-chain hardening).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Pacific/Auckland
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
