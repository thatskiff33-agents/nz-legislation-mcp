# Remote endpoint: nz-legislation-mcp behind Caddy (automatic HTTPS). See docs/self-hosting.md.
name: nz-legislation-mcp

services:
  mcp:
    # A published release, pinned by digest (set NZLM_IMAGE in .env; verify its signature first:
    # see docs/self-hosting.md). To build from this repository instead, add the build override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    # This file has no build section, so a published image is never replaced by a local build.
    image: ${NZLM_IMAGE:-nz-legislation-mcp:local}
    restart: unless-stopped
    env_file: .env
    environment:
      LEGISLATION_NZ_API_KEY_FILE: /run/secrets/legislation_api_key
      LEGISLATION_NZ_PUBLIC_URL: https://${NZLM_DOMAIN}/mcp
      # Caddy appends the real client address to X-Forwarded-For.
      LEGISLATION_NZ_TRUST_PROXY: "true"
    secrets:
      - legislation_api_key
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 100
    expose: ["8080"]
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      NZLM_DOMAIN: ${NZLM_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    # Start Caddy once the server answers its health check (the image's HEALTHCHECK).
    depends_on:
      mcp:
        condition: service_healthy

secrets:
  legislation_api_key:
    file: ./secrets/legislation_api_key

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
